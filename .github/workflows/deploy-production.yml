name: Build e deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Roda antes da imagem para dar sinal rápido (tsc/testes falham em minutos,
  # não nos ~4 do build da imagem) e para o resultado ficar auditável como job
  # próprio: `next build` já roda type-check e ESLint por baixo, mas isso fica
  # escondido dentro do log do Docker build e não cobre src/**/*.test.ts.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test

  # Antes chamava avilaops/infra/.github/workflows/container.yml, mas esse
  # repo migrou de org (avilaops -> avilainc) e a policy de acesso do
  # avilaops/infra a workflows reutilizáveis é "user" (só repos do próprio
  # avilaops) — cross-org quebra com "jobs: []", falha silenciosa, sem log
  # de job nenhum. Copiado aqui em vez de mudar a policy de um repo
  # compartilhado por outros projetos sem combinar antes.
  image:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.result.outputs.image }}
    steps:
      - name: Obter codigo do commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validar publicacao
        env:
          PUBLISH: ${{ github.event_name != 'pull_request' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" != pull_request* ]]
            [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          fi
          printf 'IMAGE_NAME=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # A imagem do BuildKit vem do espelho do Google, como a base do
      # Dockerfile: puxá-la do Docker Hub dava 429/timeout no runner e o job
      # morria antes do build. Mesmo digest nos dois registros.
      - name: Preparar Docker
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - name: Autenticar no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e validar imagem
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container
      - name: Identificar imagem publicada
        if: github.event_name != 'pull_request'
        id: result
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s@%s\n' "$IMAGE_NAME" "$DIGEST" >> "$GITHUB_OUTPUT"

  # Abre o Deployment no GitHub (aba Environments/Deployments do repo) como a
  # identidade do App "Avila Ops - Deploy DespolarizaMED", não como
  # github-actions[bot]. O App só assina o token aqui, na Actions — nunca no
  # servidor; quem toca o servidor continua sendo só o SSH (secrets DEPLOY_*).
  deployment-open:
    needs: [quality, image]
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    outputs:
      deployment_id: ${{ steps.criar.outputs.deployment_id }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: 4993452
          private-key: ${{ secrets.DESPOLARIZAMED_APP_PRIVATE_KEY }}
      - name: Criar deployment
        id: criar
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # required_contexts:[] via --input, não -F: gh api não tem uma forma
          # limpa de mandar array vazio por -f/-F, e sem isto a API assume
          # "todo status configurado no repo" como pré-requisito e o POST
          # falha (não há branch protection com status checks aqui).
          id=$(jq -n --arg ref "${{ github.sha }}" '{ref: $ref, environment: "production", auto_merge: false, required_contexts: [], description: "Deploy despolarizamed.com.br"}' \
            | gh api repos/${{ github.repository }}/deployments --input - --jq .id)
          echo "deployment_id=$id" >> "$GITHUB_OUTPUT"
          gh api repos/${{ github.repository }}/deployments/$id/statuses \
            -f state=in_progress -f description="Build da imagem ok, enviando ao servidor"

  # Antes chamava avilaops/infra/.github/workflows/deploy-ssh.yml — mesmo
  # motivo do job `image` acima (repo mudou de org, perdeu acesso cross-org
  # ao avilaops/infra). Copiado aqui.
  deploy:
    needs: [quality, image, deployment-open]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production-despolarizamed.com.br
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Enviar imagem ao servidor
        env:
          APPLICATION: despolarizamed.com.br
          IMAGE: ${{ needs.image.outputs.image }}
          DEPLOY_PORT: 22
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPLICATION" =~ ^[a-z0-9][a-z0-9.-]*$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/avilainc/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          (( DEPLOY_PORT > 0 && DEPLOY_PORT < 65536 ))
          temporary_ssh=$(mktemp -d)
          trap 'rm -rf "$temporary_ssh"' EXIT
          chmod 700 "$temporary_ssh"
          printf '%s\n' "$SSH_KEY" > "$temporary_ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$temporary_ssh/known_hosts"
          chmod 600 "$temporary_ssh/key" "$temporary_ssh/known_hosts"
          printf '%s\n' "$GHCR_TOKEN" | ssh -T -i "$temporary_ssh/key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$temporary_ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $APPLICATION $IMAGE"

  # Sempre roda depois do deploy (sucesso OU falha) para fechar o status que
  # deployment-open abriu; sem isto o Deployment fica "in_progress" para
  # sempre quando o SSH falha.
  deployment-close:
    needs: [deployment-open, deploy]
    if: always() && needs.deployment-open.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: 4993452
          private-key: ${{ secrets.DESPOLARIZAMED_APP_PRIVATE_KEY }}
      - name: Fechar deployment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            state=success; desc="Healthcheck ok, versão ${{ github.sha }} no ar"
          else
            state=failure; desc="Deploy falhou — ver o job 'deploy'"
          fi
          gh api "repos/${{ github.repository }}/deployments/${{ needs.deployment-open.outputs.deployment_id }}/statuses" \
            -f state="$state" -f description="$desc" \
            -f environment_url="https://despolarizamed.com.br"
