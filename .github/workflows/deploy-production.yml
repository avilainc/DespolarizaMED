name: Build e deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Roda antes da imagem para dar sinal rápido (tsc/testes falham em minutos,
  # não nos ~4 do build da imagem) e para o resultado ficar auditável como job
  # próprio: `next build` já roda type-check e ESLint por baixo, mas isso fica
  # escondido dentro do log do Docker build e não cobre src/**/*.test.ts.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
  image:
    needs: quality
    permissions:
      contents: read
      packages: write
    uses: avilaops/infra/.github/workflows/container.yml@5fc768f4ebf631bdcd614b3e87a148dc08dd278f
    with:
      publish: ${{ github.event_name != 'pull_request' }}
  deploy:
    permissions:
      contents: read
      packages: read
    needs: [quality, image]
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    uses: avilaops/infra/.github/workflows/deploy-ssh.yml@5fc768f4ebf631bdcd614b3e87a148dc08dd278f
    with:
      application: despolarizamed.com.br
      image: ${{ needs.image.outputs.image }}
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
